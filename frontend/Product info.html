<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Здравствуйте!</title>
    <link rel="stylesheet" href="css/Product info.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Lato:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<div class="choice-container">
    <div class="euler-top-left"></div>
    <div class="euler-bottom-right"></div>
    <img src="https://iss.ponarth.com/i/logo_white_mini.png" alt="Logo" class="logo">
    <button class="search-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="feather feather-search">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </button>
    <h1>Здравствуйте!</h1>
    <label>На вашем бонусном счету <span>200 монет.</span></label>
    <div class="button-container" id="sectionsContainer"></div>
    <img src="img/photo_ponarth.jpg" class="photo-ponarth" alt="Фото Понарт">
    <div class="beer-selection">
        <div id="beerContainer" class="beer-selection">
            <div class="loading">Loading beer data...</div>
        </div>
    </div>
    <script src="js/scriptinfo.js"></script>
    <script src="js/scriptgood.js"></script>
    <script src="js/store.js"></script>
</div>
</body>
</html>
