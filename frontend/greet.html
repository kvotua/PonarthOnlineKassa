<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Здравствуйте!</title>
    <link rel="stylesheet" href="greet.css">
    <link rel="icon" href="img/Tag_Ponart.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="img/Tag_Ponart.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/Tag_Ponart.svg">
    <script src="https://unpkg.com/imask"></script>
</head>
<body>
    <div class="greet-container">
        <div class="euler-top-left"></div>
        <div class="euler-bottom-right"></div>
        <img src="https://iss.ponarth.com/i/logo_white_mini.png" alt="Logo" class="logo">
        <h1>Введите номер</h1>
        <label>Подтвердите номер телефона для продолжения покупок</label>

        <form id="verification-form">
            <div class="phone-container">
                <input type="tel" id="phone" name="phone" placeholder="+7 (952) 999-15-18" required>
                <button type="button" class="send-sms" id="send-code">Отправить код</button>
            </div>
            <label class="labelSMS">Код-подтверждение отправлен на указанный номер</label>
            <input type="text" id="sms-code" name="smsCode" placeholder="Введите код из СМС" required>
            <div class="labelSMS">
                <label>Если код не пришёл, нажмите <span>отправить повторно (30 сек)</span></label>
            </div>
            <div class="form-footer">
                <button type="submit" id="confirm-code">Подтвердить и продолжить</button>
            </div>
        </form>
    </div>

    <script src="./js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            IMask(
                document.getElementById('phone'),
                {
                    mask: '+{7} (000) 000-00-00'
                }
            );
        });
    </script>
</body>
</html>
