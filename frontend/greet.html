<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONARTH</title>
    <link rel="stylesheet" href="greet.css">
    <link rel="icon" href="img/Tag_Ponart.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="img/Tag_Ponart.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/Tag_Ponart.svg">
    <script src="https://unpkg.com/imask"></script>
</head>

<body>
    <div class="greet-container">
        <div class="euler-top-left"></div>
        <div class="euler-bottom-right"></div>
        <img src="https://iss.ponarth.com/i/logo_white_mini.png" alt="Logo" class="logo">
        <h1>Здравствуйте!</h1>
        <div class="glass-radio-group">
            <input type="radio" name="main-tab-type" id="main-glass-call" checked />
            <label for="main-glass-call">Звонок</label>

            <input type="radio" name="main-tab-type" id="main-glass-telegram" />
            <label for="main-glass-telegram">Телеграм</label>

            <div class="glass-glider"></div>
        </div>
        <label class="labeltext">Введите номер телефона для входа в систему лояльности</label>
        <form id="verification-form">
            <div class="phone-container">
                <input type="tel" id="phone" name="phone" placeholder="+7 (952) 999-15-18" required
                    class="input-autofill">
                <button type="button" class="send-sms" id="send-code" disabled>Подтвердить</button>
            </div>
            <p class="tg-warning" id="tgWarning">У вас не подключён Telegram. Нажмите ниже, чтобы привязать аккаунт.</p>
            <div class="telegram-connect" onclick="window.open('https://t.me/your_bot_name', '_blank')"
                id="telegramConnect">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg" class="tg-icon" />
                <span>Подключить Telegram</span>
            </div>
            <div class="sms-container">
                <label class="labelSMS confirmation-label">
                    <span id="call-info">Введите последние 4 цифры входящего звонка</span></br> на номер <span
                        id="phone-number"></span>
                </label>
                <input type="text" id="sms-code" name="smsCode" placeholder="Введите последние 4 цифры">
                <div class="resend-text" style="display: none;">
                    <span id="nocall-info">Если звонок не поступил</span>, проверьте правильность вашего телефонного
                    номера или нажмите кнопку
                    <span class="resend-link timer-text disabled">
                        Подтвердить повторно ( <span class="timer">30</span> сек )
                    </span>
                </div>
            </div>
            <div class="form-footer">
                <button type="submit" id="confirm-code" style="display:none">Подтвердить и продолжить</button>
            </div>
        </form>
    </div>
    <script src="./js/script.js"></script>
    <script>
        isTokenExpired().then(expired => {
            if (!expired) {
                window.location.href = './profile.html';
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            const sendBtn = document.getElementById('send-code');
            const phoneInput = document.getElementById('phone');
            const smsContainer = document.querySelector('.sms-container');
            const phoneNumberSpan = document.getElementById('phone-number');
            const resendLink = document.querySelector('.resend-link');
            const timerSpan = document.querySelector('.timer');
            const confirmationLabel = document.querySelector('.confirmation-label');
            const resendText = document.querySelector('.resend-text');
            const smsCodeInput = document.getElementById('sms-code');
            const confirmButton = document.getElementById('confirm-code');

            const telegramConnect = document.getElementById('telegramConnect');
            const tgWarning = document.getElementById('tgWarning');

            const url_params = new URLSearchParams(window.location.search);
            const url_phone = url_params.get("phone");
            const url_call_id = url_params.get("call_id");
            const url_code = url_params.get("code");

            if (url_phone && url_call_id && url_code) {
                showAll(url_phone, url_call_id, url_code);
            }

            IMask(phoneInput, {
                mask: '+{7} (000) 000-00-00',
            });

            phoneInput.addEventListener('input', function () {
                const phoneValue = this.value.replace(/\D/g, '');
                if (phoneValue.length === 11) {
                    sendBtn.disabled = false;
                } else {
                    sendBtn.disabled = true;
                }
            })

            function formatPhone(phone) {
                phone = phone.toString().replace(/\D/g, "");

                if (phone.length === 10) {
                    return `+7 (${phone.substring(0, 3)}) ${phone.substring(3, 6)}-${phone.substring(6, 8)}-${phone.substring(8, 10)}`;
                }

                return phone;
            }

            function showAll(phone, call_id, code) {
                setCurrentTab("telegram");
                const callInfo = document.getElementById('call-info');
                const noCallInfo = document.getElementById('nocall-info');
                const smsCode = document.getElementById('sms-code')

                callInfo.innerText = 'Введите 4-х значный код полученный от бота';
                noCallInfo.innerText = 'Если сообщение не пришло';
                smsCode.placeholder = 'Введите 4-х значный код';
                localStorage.setItem('call_id', call_id);
                localStorage.setItem('call_type', 'register');
                document.querySelector('.phone-container').classList.add('disabled');
                sendBtn.disabled = true;
                sendBtn.textContent = 'Подтвердить';

                const formatted = formatPhone(phone);
                phoneInput.value = formatted;
                smsCodeInput.value = code;
                confirmButton.style.display = 'block';
                setTimeout(() => {
                    confirmButton.classList.add('visible-btn');
                }, 10);

                phoneInput.readOnly = true;

                phoneNumberSpan.textContent = phoneInput.value;
                smsContainer.classList.add('visible', 'fade-in');
                resendText.style.display = 'block';
                confirmationLabel.style.display = 'block';
            }

            smsCodeInput.addEventListener('input', function () {
                const isValid = this.value.length === 4;

                if (isValid) {
                    confirmButton.style.display = 'block';
                    setTimeout(() => {
                        confirmButton.classList.add('visible-btn');
                    }, 10);
                } else {
                    confirmButton.classList.remove('visible-btn');
                    confirmButton.addEventListener('transitionend', function handler() {
                        if (!confirmButton.classList.contains('visible-btn')) {
                            confirmButton.style.display = 'none';
                        }
                        confirmButton.removeEventListener('transitionend', handler);
                    });
                }
            });

            sendBtn.addEventListener('click', function () {
                const phoneInput = document.getElementById('phone');
                const phone = phoneInput.value;

                if (phone && !sendBtn.disabled) {
                    sendPhoneVerification(phone)
                        .then(response => {
                            console.log(response);
                            if (response.error) {
                                if (response.error_detail) {
                                    if (response.error_detail == "no_telegram") {
                                        telegramConnect.style.display = 'flex';
                                        tgWarning.style.display = 'flex';
                                        telegramConnect.classList.add('fade-in');
                                        tgWarning.classList.add('fade-in');
                                    } else {
                                        alert(response.message);
                                    }
                                } else {
                                    alert(response.message);
                                }
                            } else if (response.call_id) {
                                if (response.error_detail) {
                                    telegramConnect.style.display = 'flex';
                                    tgWarning.style.display = 'flex';
                                    tgWarning.innerText = 'У вас нет аккаунта в лояльности. Нажмите ниже, чтобы получить код для регистраци.';
                                    telegramConnect.classList.add('fade-in');
                                    tgWarning.classList.add('fade-in');
                                } else {
                                    telegramConnect.style.display = 'none';
                                    tgWarning.style.display = 'none';
                                }
                                localStorage.setItem('call_id', response.call_id);
                                localStorage.setItem('call_type', response.call_type);
                                document.querySelector('.phone-container').classList.add('disabled');
                                sendBtn.disabled = true;
                                sendBtn.textContent = 'Подтвердить';

                                phoneInput.readOnly = true;

                                phoneNumberSpan.textContent = phoneInput.value;
                                smsContainer.classList.add('visible', 'fade-in');
                                resendText.style.display = 'block';
                                confirmationLabel.style.display = 'block';

                                startCountdown(30);
                            }
                        })
                } else {
                    alert('Пожалуйста, введите номер телефона.');
                }

            });

            function startCountdown(seconds) {
                let remaining = seconds;

                const timerWrapper = document.querySelector('.resend-link.timer-text');
                const timerSpan = document.querySelector('.resend-link.timer-text .timer');

                timerWrapper.innerHTML = `Подтвердить повторно (<span class="timer">${remaining}</span> сек)`;
                timerWrapper.classList.add('disabled');

                const currentTimerSpan = timerWrapper.querySelector('.timer');

                const timer = setInterval(() => {
                    remaining--;
                    currentTimerSpan.textContent = remaining;

                    if (remaining <= 0) {
                        clearInterval(timer);
                        sendBtn.disabled = false;
                        timerWrapper.classList.remove('disabled');
                        timerWrapper.textContent = 'Подтвердить';

                        document.querySelector('.phone-container').classList.remove('disabled');
                        phoneInput.readOnly = false;
                    }
                }, 1000);
            }

            resendLink.addEventListener('click', function () {
                if (!sendBtn.classList.contains('disabled')) {
                    sendBtn.click();
                }
            });
        });
    </script>
</body>

</html>
