<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Здравствуйте!</title>
    <link rel="stylesheet" href="css/Product info.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Lato:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<div class="choice-container">
    <div class="euler-top-left"></div>
    <div class="euler-bottom-right"></div>


    <img src="https://iss.ponarth.com/i/logo_white_mini.png" alt="Logo" class="logo">

    <h1>Наш магазин</h1>
    <div class="search-container">
        <div class="search-input-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск товаров...">
            <button id="clearSearch" class="clear-search-btn" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
    <div class="button-container" id="sectionsContainer"></div>

    <div class="bonus-container">
        <div class="bonus-balance">
            <svg class="coin-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path
                        d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
                        stroke="#F9D03F" stroke-width="2" />
                <path d="M12 6V18" stroke="#F9D03F" stroke-width="2" stroke-linecap="round" />
                <path
                        d="M15 9.5C15 8.11929 13.6569 7 12 7C10.3431 7 9 8.11929 9 9.5C9 10.8807 10.3431 12 12 12C13.6569 12 15 13.1193 15 14.5C15 15.8807 13.6569 17 12 17C10.3431 17 9 15.8807 9 14.5"
                        stroke="#F9D03F" stroke-width="2" />
            </svg>
            <span>На вашем бонусном счету</span>
            <span id="scoreAmount" class="amount">0 монет</span>
        </div>

        <div class="cashback-info">
            <div class="cashback-card">
                <div class="cashback-rate">
                    <span>10%</span>
                    <small>стандартный кешбек</small>
                </div>
                <div class="cashback-divider">
                    <div class="arrow"></div>
                </div>
                <div class="cashback-rate special">
                    <span>15%</span>
                    <small>при оплате наличными</small>
                </div>
            </div>
            <p class="cashback-hint">Оплачивайте товары наличными и получайте +50% к кешбеку!</p>
        </div>
    </div>
    <div class="beer-selection">
        <div id="beerContainer" class="beer-selection">
            <div class="loading">Loading beer data...</div>
        </div>
    </div>
    <div class="bottom-panel">
        <button class="cart" onclick="location.href='bascket.html';">
            <i class='bx bx-cart-alt'></i>
        </button>
    </div>

</div>
<script src="js/scriptinfo.js"></script>
<script src="js/scriptgood.js"></script>
<script src="js/store.js"></script>
<script src="js/script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const scoreElement = document.getElementById('scoreAmount');
        const score = localStorage.getItem('scoreAmount');
        scoreElement.textContent = score ? `${score} монет.` : "0 монет.";



        const new_user_score = document.getElementById('new_user_score');
        new_user = JSON.parse(localStorage.getItem('new_user_score'));
        if(!new_user){
            new_user_score.style.display = 'none';
        }


        const time_Passed = document.getElementById("timePassed");
        time_Passed.innerHTML = localStorage.getItem("timePassed");
    });
</script>
</body>
</html>
